<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>On fait quoi ?</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f141b;
  color:#f4f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.back{
  font-size:25px;
  cursor:pointer;
}

h1{
  font-size:25px;
  margin:0;
}

.subtitle{
  color:#96a2b1;
  margin-bottom:25px;
}

.card{
  background:#171e27;
  border:1px solid #293341;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:600;
}

select,
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #394656;
  background:#0f141b;
  color:#fff;
  font-size:16px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  padding:14px;
  border:1px solid #394656;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  background:#111820;
}

.option.active{
  border-color:#4f9cff;
  background:#182c45;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#4f9cff;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.result{
  display:none;
  margin-top:20px;
}

.result h2{
  margin-top:0;
}

.price{
  font-size:30px;
  font-weight:800;
  margin:10px 0;
}

.muted{
  color:#96a2b1;
  font-size:14px;
}

.activity{
  padding:12px 0;
  border-bottom:1px solid #293341;
}

.activity:last-child{
  border-bottom:0;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="back" onclick="history.back()">‹</div>
  <h1>On fait quoi ?</h1>
</header>

<div class="subtitle">
  Trouve une activité adaptée à ton groupe, ton budget et ton envie.
</div>

<div class="card">

<label>Combien de personnes ?</label>

<select id="people">
  <option value="1">1 personne</option>
  <option value="2">2 personnes</option>
  <option value="3">3 personnes</option>
  <option value="4">4 personnes</option>
  <option value="5">5 personnes</option>
  <option value="6">6 personnes</option>
  <option value="7">7 personnes</option>
  <option value="8">8 personnes</option>
  <option value="9">9 personnes</option>
  <option value="10">10 personnes</option>
</select>

</div>

<div class="card">

<label>Budget par personne</label>

<select id="budget">
  <option value="10">Jusqu'à 10 €</option>
  <option value="20">Jusqu'à 20 €</option>
  <option value="30">Jusqu'à 30 €</option>
  <option value="50">Jusqu'à 50 €</option>
  <option value="100">Plus de 50 €</option>
</select>

</div>

<div class="card">

<label>Quel type d'activité ?</label>

<div class="options">

<div class="option active" data-type="random">
🎲 Surprise
</div>

<div class="option" data-type="food">
🍔 Manger
</div>

<div class="option" data-type="fun">
🎮 Fun
</div>

<div class="option" data-type="outdoor">
🌳 Extérieur
</div>

<div class="option" data-type="culture">
🎬 Culture
</div>

<div class="option" data-type="sport">
🏎️ Sport
</div>

</div>

</div>

<div class="card">

<label>Quand ?</label>

<select id="when">
  <option>Maintenant</option>
  <option>Ce soir</option>
  <option>Demain</option>
  <option>Ce week-end</option>
</select>

</div>

<button onclick="findActivity()">
✨ Trouver une activité
</button>

<div class="card result" id="result">

<h2>🎯 Ton idée</h2>

<div class="activity">
<strong id="activityName"></strong>
</div>

<div class="muted">
Pour <span id="resultPeople"></span> personne(s)
</div>

<div class="price">
<span id="totalPrice"></span> €
</div>

<div class="muted">
Budget total estimé
</div>

<br>

<div class="activity">
📍 Activité à proximité
</div>

<div class="activity">
🕐 <span id="resultWhen"></span>
</div>

</div>

</div>

<script>

let selectedType="random";

document.querySelectorAll(".option").forEach(option=>{
  option.addEventListener("click",()=>{
    document.querySelectorAll(".option")
      .forEach(o=>o.classList.remove("active"));

    option.classList.add("active");
    selectedType=option.dataset.type;
  });
});

function findActivity(){

  const people=parseInt(
    document.getElementById("people").value
  );

  const budget=parseInt(
    document.getElementById("budget").value
  );

  const when=document.getElementById("when").value;

  const activities={

    random:[
      ["🎳 Bowling",20],
      ["🎬 Cinéma",12],
      ["🍔 Restaurant",25],
      ["🎮 Salle de jeux",20],
      ["🏎️ Karting",30]
    ],

    food:[
      ["🍔 Restaurant",25],
      ["🍕 Pizzeria",18],
      ["🥞 Brunch",22]
    ],

    fun:[
      ["🎳 Bowling",20],
      ["🎮 Salle de jeux",20],
      ["🕵️ Escape game",30]
    ],

    outdoor:[
      ["🌳 Balade",0],
      ["🏖️ Sortie plage",0],
      ["🥾 Randonnée",0]
    ],

    culture:[
      ["🎬 Cinéma",12],
      ["🏛️ Musée",10],
      ["🎭 Spectacle",30]
    ],

    sport:[
      ["🏎️ Karting",30],
      ["🎳 Bowling",20],
      ["⚽ Activité sportive",15]
    ]

  };

  let list=activities[selectedType];

  let possible=list.filter(a=>a[1]<=budget);

  if(possible.length===0){
    possible=list;
  }

  const choice=
    possible[Math.floor(Math.random()*possible.length)];

  const total=choice[1]*people;

  document.getElementById("activityName").textContent=
    choice[0];

  document.getElementById("resultPeople").textContent=
    people;

  document.getElementById("totalPrice").textContent=
    total;

  document.getElementById("resultWhen").textContent=
    when;

  document.getElementById("result").style.display="block";

  document.getElementById("result")
    .scrollIntoView({behavior:"smooth"});
}

</script>

</body>
</html>
